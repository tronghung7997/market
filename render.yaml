databases:
  - name: marketplace-db
    databaseName: marketplace
    user: marketplace
    plan: free

services:
  - type: redis
    name: marketplace-redis
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: marketplace-svc
    env: docker
    dockerfilePath: ./marketplace-svc/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: marketplace-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PLATFORM_FEE_PERCENT
        value: "0"

  - type: web
    name: marketplace-frontend
    env: node
    buildCommand: npm install && npm run build && cp -r .next/static .next/standalone/.next/static
    startCommand: node .next/standalone/server.js
    plan: free
    rootDir: frontend
    envVars:
      - key: API_URL
        fromService:
          name: marketplace-svc
          type: web
          property: url
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: marketplace-svc
          type: web
          property: url
      - key: NODE_ENV
        value: production
